name: automation-maintenance
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [telegram, telegram-channels, guitars]
        default: telegram
      apply:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  telegram-channels:
    if: inputs.operation == 'telegram-channels' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        environment: [kit-weekly, kit-weekly-wyreguitars]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m core.automation_maintenance telegram
        env:
          KIT_TELEGRAM_TOKEN: ${{ secrets.KIT_TELEGRAM_TOKEN }}
          KIT_TELEGRAM_CHAT_ID: ${{ secrets.KIT_TELEGRAM_CHAT_ID }}
          TELEGRAM_SOURCE: ${{ matrix.environment }}
  telegram:
    if: inputs.operation == 'telegram' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m core.automation_maintenance telegram
        env:
          KIT_TELEGRAM_TOKEN: ${{ secrets.AUTOMATION_TELEGRAM_TOKEN || secrets.KIT_TELEGRAM_TOKEN }}
          KIT_TELEGRAM_CHAT_ID: ${{ secrets.AUTOMATION_TELEGRAM_CHAT_ID || secrets.KIT_TELEGRAM_CHAT_ID }}
  guitars:
    if: inputs.operation == 'guitars' && github.ref == 'refs/heads/master'
    environment: kit-weekly-wyreguitars
    concurrency:
      group: kit-weekly-wyreguitars
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-worker.txt
      - run: python -m core.automation_maintenance guitars $APPLY
        env:
          APPLY: ${{ inputs.apply && '--apply' || '' }}
          KIT_YT_TOKEN_JSON: ${{ secrets.KIT_YT_TOKEN_JSON }}
          KIT_DROPBOX_APP_KEY: ${{ secrets.KIT_DROPBOX_APP_KEY }}
          KIT_DROPBOX_REFRESH_TOKEN: ${{ secrets.KIT_DROPBOX_REFRESH_TOKEN }}
