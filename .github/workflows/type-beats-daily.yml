name: type-beats-daily

on:
  schedule:
    - cron: '0 22 * * *' # 19:00 Buenos Aires; fills the next 14 days.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only simulation, no uploads or Telegram'
        type: boolean
        default: true
      private_pilot:
        description: 'One eligible job per channel, private without scheduled publication'
        type: boolean
        default: true

permissions:
  contents: read

# Serialize whole daily runs too: Beats uses one global planner/render lease.
concurrency:
  group: type-beats-daily
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'Perree/video-type-beat-generator' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: plan
        env:
          BEAT_ACTIONS_MODE: matrix
          BEAT_CHANNELS: ${{ vars.BEAT_CHANNELS }}
        run: python3 scripts/beat_actions.py >> "$GITHUB_OUTPUT"

  daily:
    needs: plan
    if: github.repository == 'Perree/video-type-beat-generator' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: type-beats-${{ matrix.channel }}
    concurrency:
      group: type-beats-daily-${{ matrix.channel }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Environment only permits master
        env:
          BEAT_SLUG: ${{ matrix.channel }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/beat_actions.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --require-hashes -r requirements-worker.txt
      - name: Offline Type Beats smokes (worker environment)
        env:
          BEAT_REAL_FFMPEG_SMOKE: '1'
        run: python scripts/smoke_beat_hardening.py --worker-only
      - name: Daily worker
        env:
          BEAT_SLUG: ${{ matrix.channel }}
          BEAT_CHANNEL_ID: ${{ secrets.BEAT_CHANNEL_ID }}
          BEAT_YT_TOKEN_JSON: ${{ secrets.BEAT_YT_TOKEN_JSON }}
          BEAT_DROPBOX_APP_KEY: ${{ secrets.BEAT_DROPBOX_APP_KEY }}
          BEAT_DROPBOX_REFRESH_TOKEN: ${{ secrets.BEAT_DROPBOX_REFRESH_TOKEN }}
          BEAT_NOTION_TOKEN: ${{ secrets.BEAT_NOTION_TOKEN }}
          BEAT_NOTION_PAGE_ID: ${{ secrets.BEAT_NOTION_PAGE_ID }}
          BEAT_TELEGRAM_TOKEN: ${{ secrets.BEAT_TELEGRAM_TOKEN }}
          BEAT_TELEGRAM_CHAT_ID: ${{ secrets.BEAT_TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ (inputs.dry_run || (vars.BEAT_LIVE_ENABLED != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.private_pilot))) && 'true' || 'false' }}
          PRIVATE_PILOT: ${{ github.event_name == 'workflow_dispatch' && inputs.private_pilot && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_beat_daily.py --dry-run
          elif [ "$PRIVATE_PILOT" = "true" ]; then
            python scripts/run_beat_daily.py --private-pilot
          else
            python scripts/run_beat_daily.py
          fi
      - name: Preserve upload receipts and orphans even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: type-beats-receipts-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: exported_videos/type_beats/receipts/*.json
          if-no-files-found: ignore
          retention-days: 90
