name: kit-weekly

# Solo por horario o a mano. Nunca pull_request: un PR de un fork no debe poder
# leer secretos ni ejecutar el worker.
on:
  schedule:
    # Todos los días 23:00 UTC = 20:00 en Buenos Aires. El job plan deja pasar solo los
    # canales a los que les toca hoy (sin KIT_CHANNELS: el canal por defecto, los domingos).
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal: su slug en KIT_CHANNELS, o "default" para el primero'
        type: string
        default: default
      dry_run:
        description: 'Solo elegir kits y slots; no renderiza ni sube'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Sin secretos ni Environment: solo decide qué canales corren.
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - id: plan
        env:
          # Variable del repo (no secreto): "slug[=dia]" separados por coma. Ver docs/KIT_WEEKLY.md.
          KIT_CHANNELS: ${{ vars.KIT_CHANNELS }}
          # El input va por entorno y se valida en el script: nunca se interpola en el shell.
          KIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || '' }}
        run: python3 scripts/kit_plan.py >> "$GITHUB_OUTPUT"

  weekly:
    needs: plan
    # Solo la rama principal. El Environment es el que de verdad limita quién ve los secretos:
    # en Settings > Environments, restringir cada uno a master y cargar ahí sus secretos.
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Un Environment por canal, con los mismos nombres de secretos en cada uno. El canal por
    # defecto usa "kit-weekly" (suffix vacío); el resto, "kit-weekly-<slug>".
    environment: kit-weekly${{ matrix.suffix }}
    concurrency:
      group: kit-weekly${{ matrix.suffix }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        # Versiones exactas y hashes: pip rechaza cualquier paquete que no coincida.
        run: python -m pip install --require-hashes -r requirements-worker.txt

      - name: Correr el worker
        env:
          # Slug ya validado por el job plan; elige config, catálogo y estado del canal.
          KIT_AUTOMATION: ${{ matrix.channel }}
          KIT_YT_CHANNEL: ${{ secrets.KIT_YT_CHANNEL }}
          KIT_YT_TOKEN_JSON: ${{ secrets.KIT_YT_TOKEN_JSON }}
          KIT_DROPBOX_REFRESH_TOKEN: ${{ secrets.KIT_DROPBOX_REFRESH_TOKEN }}
          KIT_DROPBOX_APP_KEY: ${{ secrets.KIT_DROPBOX_APP_KEY }}
          KIT_LLM_API_KEY: ${{ secrets.KIT_LLM_API_KEY }}
          KIT_IMAGE_API_KEY: ${{ secrets.KIT_IMAGE_API_KEY }}
          KIT_TELEGRAM_TOKEN: ${{ secrets.KIT_TELEGRAM_TOKEN }}
          KIT_TELEGRAM_CHAT_ID: ${{ secrets.KIT_TELEGRAM_CHAT_ID }}
          # Informe semanal de tendencias (opcional): clave de lectura de Notion y su página.
          KIT_NOTION_TOKEN: ${{ secrets.KIT_NOTION_TOKEN }}
          KIT_NOTION_PAGE_ID: ${{ secrets.KIT_NOTION_PAGE_ID }}
          # Hosts extra para el LLM o la API de imágenes (variable del repo, no secreto).
          KIT_API_HOSTS: ${{ vars.KIT_API_HOSTS }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_kit_weekly.py --dry-run
          else
            python scripts/run_kit_weekly.py
          fi
