name: kit-weekly

# Solo por horario o a mano. Nunca pull_request: un PR de un fork no debe poder
# leer secretos ni ejecutar el worker.
on:
  schedule:
    - cron: '0 23 * * 0'  # domingo 23:00 UTC = domingo 20:00 en Buenos Aires
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo elegir kits y slots; no renderiza ni sube'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kit-weekly
  cancel-in-progress: false

jobs:
  weekly:
    # Solo la rama principal. El Environment es el que de verdad limita quién ve los secretos:
    # en Settings > Environments > kit-weekly, restringirlo a master y cargar ahí los secretos.
    if: github.ref == 'refs/heads/master'
    environment: kit-weekly
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        # Versiones exactas y hashes: pip rechaza cualquier paquete que no coincida.
        run: python -m pip install --require-hashes -r requirements-worker.txt

      - name: Correr el worker
        env:
          KIT_YT_CHANNEL: ${{ secrets.KIT_YT_CHANNEL }}
          KIT_YT_TOKEN_JSON: ${{ secrets.KIT_YT_TOKEN_JSON }}
          KIT_DROPBOX_REFRESH_TOKEN: ${{ secrets.KIT_DROPBOX_REFRESH_TOKEN }}
          KIT_DROPBOX_APP_KEY: ${{ secrets.KIT_DROPBOX_APP_KEY }}
          KIT_LLM_API_KEY: ${{ secrets.KIT_LLM_API_KEY }}
          KIT_IMAGE_API_KEY: ${{ secrets.KIT_IMAGE_API_KEY }}
          KIT_TELEGRAM_TOKEN: ${{ secrets.KIT_TELEGRAM_TOKEN }}
          KIT_TELEGRAM_CHAT_ID: ${{ secrets.KIT_TELEGRAM_CHAT_ID }}
          # Hosts extra para el LLM o la API de imágenes (variable del repo, no secreto).
          KIT_API_HOSTS: ${{ vars.KIT_API_HOSTS }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_kit_weekly.py --dry-run
          else
            python scripts/run_kit_weekly.py
          fi
